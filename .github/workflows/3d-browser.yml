name: Browser 3D smoke test
on:
  push:
    branches: [main]
    paths:
      - 'traffic_control_view.py'
      - 'traffic_control_sim.py'
      - 'tests/traffic_3d_browser.mjs'
      - 'tests/generate_browser_3d_fixture.py'
      - 'tests/generate_surveyed_fixture.py'
      - 'tests/surveyed_3d_browser.mjs'
      - 'calibrated_scene_view.py'
      - 'reconstruction.py'
      - 'metric_scene.py'
      - '.github/workflows/3d-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and fixture dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install 'streamlit>=1.60,<2' 'reportlab>=4,<5' 'opencv-python-headless>=4.8,<5'
          npm install --no-save --no-package-lock 'playwright@1.56.1'
          npx playwright install --with-deps chromium
      - name: Create 3D fixture and serve it
        run: |
          mkdir -p "$RUNNER_TEMP/road3d"
          python tests/generate_browser_3d_fixture.py "$RUNNER_TEMP/road3d/scene.html"
          python tests/generate_surveyed_fixture.py "$RUNNER_TEMP/road3d/survey.html"
          python -m http.server 8123 --bind 127.0.0.1 --directory "$RUNNER_TEMP/road3d" > /tmp/road3d-http.log 2>&1 &
          sleep 3
      - name: Verify working 3D and signal behaviors in Chromium
        run: node tests/traffic_3d_browser.mjs
      - name: Verify source-surveyed road 3D in Chromium
        run: node tests/surveyed_3d_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-3d-browser-screenshots
          path: |
            road3d-*.png
            surveyed-road-*.png
          if-no-files-found: ignore
