name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless "lap>=0.5.12,<1"
          python -m pip install 'streamlit>=1.40,<2' 'pandas>=2,<3' 'requests>=2,<3' 'yt-dlp>=2025.1.15,<2028'
      - name: Smoke test ByteTrack assignment dependency
        run: python -c "import lap, numpy as np; cost, rows, cols = lap.lapjv(np.array([[0.0, 1.0], [1.0, 0.0]])); assert list(rows) == [0, 1]"
      - name: Compile Python
        run: python -m compileall -q app.py video_ui.py ui_theme.py video_engine.py scene_intelligence.py live_sources.py analysis.py database.py receiver.py routes.py weather.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test hosted Streamlit UI
        env:
          SMART_ROAD_HOSTED: '1'
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py').run(timeout=35)
          if app.exception:
              raise AssertionError(f'Streamlit runtime exception: {app.exception}')
          assert app.radio, 'Expected interactive navigation'
          for section in ['Intelligence', 'Events & reports', 'Workspace']:
              app.radio[0].set_value(section)
              app.run(timeout=35)
              if app.exception:
                  raise AssertionError(f'Error on {section}: {app.exception}')
          app.radio[0].set_value('Workspace')
          app.run(timeout=35)
          app.radio[1].set_value('YouTube Live (beta)')
          app.run(timeout=35)
          if app.exception:
              raise AssertionError(f'Error on live source selector: {app.exception}')
          assert any('YouTube LIVE URL' in item.label for item in app.text_input)
          print('Hosted UI, navigation and YouTube source form render successfully')
          PY

      - name: One-time diagnostic - FWvIPfxK5Jo YouTube live metadata
        continue-on-error: true
        run: |
          timeout 65s python - <<'PY'
          from live_sources import canonical_youtube_live_url, resolve_youtube_live
          url = "https://www.youtube.com/watch?v=FWvIPfxK5Jo"
          print("VALID_URL:", canonical_youtube_live_url(url), flush=True)
          try:
              import yt_dlp
              opts = {"skip_download": True, "quiet": True, "no_warnings": True,
                      "noplaylist": True, "socket_timeout": 10, "retries": 0,
                      "extractor_retries": 0, "format": "best[height<=720]/best"}
              with yt_dlp.YoutubeDL(opts) as ydl:
                  info = ydl.extract_info(url, download=False)
              print("VIDEO_TITLE:", str(info.get("title", ""))[:120], flush=True)
              print("IS_LIVE:", info.get("is_live"), flush=True)
              print("LIVE_STATUS:", info.get("live_status"), flush=True)
              print("MEDIA_AVAILABLE:", bool(info.get("url")), flush=True)
          except Exception as e:
              print("PROBE_ERROR:", type(e).__name__, str(e)[:700], flush=True)
          PY
