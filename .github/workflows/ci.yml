name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless "lap>=0.5.12,<1"
          python -m pip install 'streamlit>=1.40,<2' 'pandas>=2,<3' 'requests>=2,<3' 'yt-dlp>=2025.1.15,<2028'
      - name: Smoke test ByteTrack assignment dependency
        run: python -c "import lap, numpy as np; cost, rows, cols = lap.lapjv(np.array([[0.0, 1.0], [1.0, 0.0]])); assert list(rows) == [0, 1]"
      - name: Compile Python
        run: python -m compileall -q app.py video_ui.py ui_theme.py video_engine.py scene_intelligence.py live_sources.py analysis.py database.py receiver.py routes.py weather.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test hosted Streamlit UI
        env:
          SMART_ROAD_HOSTED: '1'
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py').run(timeout=35)
          if app.exception:
              raise AssertionError(f'Streamlit runtime exception: {app.exception}')
          assert app.radio, 'Expected interactive navigation'
          for section in ['Intelligence', 'Events & reports', 'Workspace']:
              app.radio[0].set_value(section)
              app.run(timeout=35)
              if app.exception:
                  raise AssertionError(f'Error on {section}: {app.exception}')
          app.radio[0].set_value('Workspace')
          app.run(timeout=35)
          app.radio[1].set_value('YouTube Live (beta)')
          app.run(timeout=35)
          if app.exception:
              raise AssertionError(f'Error on live source selector: {app.exception}')
          assert any('YouTube LIVE URL' in item.label for item in app.text_input)
          print('Hosted UI, navigation and YouTube source form render successfully')
          PY

