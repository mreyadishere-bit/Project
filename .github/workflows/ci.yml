name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless "lap>=0.5.12,<1"
      - name: Smoke test ByteTrack assignment dependency
        run: python -c "import lap, numpy as np; cost, rows, cols = lap.lapjv(np.array([[0.0, 1.0], [1.0, 0.0]])); assert list(rows) == [0, 1]"
      - name: Compile Python
        run: python -m compileall -q app.py video_ui.py video_engine.py analysis.py database.py receiver.py routes.py weather.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
