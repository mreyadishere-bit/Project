name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg for real HLS integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless "lap>=0.5.12,<1"
          python -m pip install 'streamlit>=1.40,<2' 'pandas>=2,<3' 'requests>=2,<3' 'yt-dlp>=2025.1.15,<2028'
      - name: Smoke test ByteTrack assignment dependency
        run: python -c "import lap, numpy as np; cost, rows, cols = lap.lapjv(np.array([[0.0, 1.0], [1.0, 0.0]])); assert list(rows) == [0, 1]"
      - name: Compile Python
        run: python -m compileall -q app.py video_ui.py ui_theme.py video_engine.py scene_intelligence.py live_sources.py analysis.py database.py receiver.py routes.py weather.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test hosted Streamlit UI
        env:
          SMART_ROAD_HOSTED: '1'
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py').run(timeout=35)
          if app.exception:
              raise AssertionError(f'Streamlit runtime exception: {app.exception}')
          assert app.radio, 'Expected interactive navigation'
          for section in ['Intelligence', 'Events & reports', 'Workspace']:
              app.radio[0].set_value(section)
              app.run(timeout=35)
              if app.exception:
                  raise AssertionError(f'Error on {section}: {app.exception}')
          app.radio[0].set_value('Workspace')
          app.run(timeout=35)
          app.radio[1].set_value('YouTube Live (beta)')
          app.run(timeout=35)
          if app.exception:
              raise AssertionError(f'Error on live source selector: {app.exception}')
          assert any('YouTube LIVE URL' in item.label for item in app.text_input)
          print('Hosted UI, navigation and YouTube source form render successfully')
          PY



      - name: Temporary check official public road HLS feeds
        timeout-minutes: 2
        continue-on-error: true
        run: |
          python - <<'PY'
          import subprocess, urllib.request
          urls = {
              "caltrans-sacramento": "https://wzmedia.dot.ca.gov/D3/5_Pocket_Rd_OC_SAC5_SB.stream/playlist.m3u8",
              "seattle-spokane": "https://58cc2dce193dd.streamlock.net/live/11_SW_Spokane_EW.stream/playlist.m3u8",
              "seattle-50th": "https://58cc2dce193dd.streamlock.net/live/12_NE_50_EW.stream/playlist.m3u8",
              "caltrans-la": "https://wzmedia.dot.ca.gov/D7/CCTV-101.stream/playlist.m3u8",
          }
          for name,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=10) as res:
                      head=res.read(300).decode("utf-8",errors="replace")
                      print(name, "HTTP", res.status, "M3U8", head.startswith("#EXTM3U"), flush=True)
                  proc=subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-nostdin",
                     "-rw_timeout","8000000","-i",url,"-frames:v","1","-f","image2","-c:v","mjpeg","-"],
                     stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=17)
                  print(name,"DECODE_OK",proc.returncode==0 and len(proc.stdout)>1000,
                        "BYTES",len(proc.stdout),"ERROR",proc.stderr.decode(errors="replace")[:160],flush=True)
              except Exception as ex:
                  print(name,"CHECK_ERROR",type(ex).__name__,str(ex)[:200],flush=True)
          PY
