name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |\n          python -m pip install --upgrade pip\n          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu\n          python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py video_ui.py video_engine.py analysis.py database.py receiver.py routes.py weather.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
