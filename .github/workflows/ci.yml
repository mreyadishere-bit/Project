name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg for real HLS integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless "lap>=0.5.12,<1"
          python -m pip install 'streamlit>=1.40,<2' 'pandas>=2,<3' 'requests>=2,<3' 'yt-dlp>=2025.1.15,<2028' 'reportlab>=4,<5'
      - name: Smoke test ByteTrack assignment dependency
        run: python -c "import lap, numpy as np; cost, rows, cols = lap.lapjv(np.array([[0.0, 1.0], [1.0, 0.0]])); assert list(rows) == [0, 1]"
      - name: Compile Python
        run: python -m compileall -q app.py video_ui.py results_ui.py reconstruction_ui.py reconstruction.py traffic_geometry.py metric_scene.py traffic_metrics.py simulation_ui.py simulation_engine.py insight_engine.py ui_theme.py video_engine.py scene_intelligence.py road_tracking.py road_advice.py road_scenarios.py road_world3d.py road_compare3d.py video_comparison.py scene_background.py safety_interactions.py traffic_control_sim.py traffic_robustness.py traffic_control_view.py detection_qa.py road_report_pdf.py calibrated_measurements.py road_calibration_validation.py road_calibration_ui.py calibrated_scene_view.py model_runtime.py simple_workspace.py simple_results.py stable_scene.py live_sources.py live_decoder.py public_cameras.py analysis.py database.py receiver.py routes.py weather.py
      - name: Verify 3D road geometry in actual Three.js
        run: |
          npm install --no-save --no-package-lock --prefix /tmp/smart-road-three three@0.170.0
          node tests/road_projection_smoke.mjs
          node tests/road_motion_smoke.mjs
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test redesigned zero-settings hosted UI
        env:
          SMART_ROAD_HOSTED: '1'
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py').run(timeout=40)
          if app.exception:
              raise AssertionError(f'Hosted UI error: {app.exception}')
          from simple_workspace import video_tab
          import inspect
          assert 'st.file_uploader' in inspect.getsource(video_tab), 'One source uploader expected'
          assert len(app.radio) == 0, 'No settings or navigation radios expected'
          assert len(app.slider) == 0, 'No configuration sliders expected'
          assert any('Analyze road' in b.label for b in app.button), 'Analyze action missing'
          print('New minimal road upload workspace renders successfully')
          PY
