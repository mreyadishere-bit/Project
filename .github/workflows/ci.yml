name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless "lap>=0.5.12,<1"
          python -m pip install 'streamlit>=1.40,<2' 'pandas>=2,<3' 'requests>=2,<3' 'yt-dlp>=2025.1.15,<2028'
      - name: Smoke test ByteTrack assignment dependency
        run: python -c "import lap, numpy as np; cost, rows, cols = lap.lapjv(np.array([[0.0, 1.0], [1.0, 0.0]])); assert list(rows) == [0, 1]"
      - name: Compile Python
        run: python -m compileall -q app.py video_ui.py ui_theme.py video_engine.py scene_intelligence.py live_sources.py analysis.py database.py receiver.py routes.py weather.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test hosted Streamlit UI
        env:
          SMART_ROAD_HOSTED: '1'
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('app.py').run(timeout=35)
          if app.exception:
              raise AssertionError(f'Streamlit runtime exception: {app.exception}')
          assert app.radio, 'Expected interactive navigation'
          for section in ['Intelligence', 'Events & reports', 'Workspace']:
              app.radio[0].set_value(section)
              app.run(timeout=35)
              if app.exception:
                  raise AssertionError(f'Error on {section}: {app.exception}')
          app.radio[0].set_value('Workspace')
          app.run(timeout=35)
          app.radio[1].set_value('YouTube Live (beta)')
          app.run(timeout=35)
          if app.exception:
              raise AssertionError(f'Error on live source selector: {app.exception}')
          assert any('YouTube LIVE URL' in item.label for item in app.text_input)
          print('Hosted UI, navigation and YouTube source form render successfully')
          PY


      - name: Temporary metadata-only format diagnosis - YouTube FWvIPfxK5Jo
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import yt_dlp
          u = "https://www.youtube.com/watch?v=FWvIPfxK5Jo"
          opts = {"quiet": True, "no_warnings": True, "skip_download": True, "noplaylist": True,
                  "ignore_no_formats_error": True, "socket_timeout": 10, "retries": 0,
                  "extractor_retries": 0}
          try:
              with yt_dlp.YoutubeDL(opts) as ydl:
                  info = ydl.extract_info(u, download=False)
              print("STATUS", str(info.get("live_status"))[:70], "IS_LIVE", info.get("is_live"), flush=True)
              formats = info.get("formats") or []
              print("FORMAT_COUNT", len(formats), flush=True)
              print("FORMAT_TYPES", [
                  (x.get("format_id"), x.get("protocol"), x.get("vcodec"), x.get("ext"), x.get("height"))
                  for x in formats[:18]], flush=True)
              print("DIRECT_MEDIA_AVAILABLE", bool(info.get("url")), flush=True)
          except Exception as exc:
              print("FORMAT_PROBE_ERROR", type(exc).__name__, str(exc)[:400], flush=True)
          PY
