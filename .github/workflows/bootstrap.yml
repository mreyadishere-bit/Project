name: Bootstrap Smart Road sources
on:
  push:
    branches: [main]
    paths:
      - bootstrap/READY
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source tree
        shell: bash
        run: |
          cat bootstrap/part*.b64 | base64 -d > /tmp/smartroad.tar.xz
          echo "3fb732d7b8907887dfa7a7b0090213902ab427cdbd98ff5010bd4e48061f15b8  /tmp/smartroad.tar.xz" | sha256sum -c -
          tar -xJf /tmp/smartroad.tar.xz -C .
          rm -rf bootstrap .github/workflows/bootstrap.yml
          python -m compileall -q app.py video_ui.py video_engine.py analysis.py database.py receiver.py routes.py weather.py
      - name: Commit project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import Smart Road video intelligence v2 source"
          git push
